spring:
  application:
    name: 'logistica'
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:icompras-logistica}
      auto-offset-reset: earliest

server:
  port: 8085

icompras:
  config:
    kafka:
      topics:
        pedidos-faturados: ${KAFKA_TOPIC_PEDIDOS_FATURADOS:icompras.pedidos-faturados}
        pedidos-enviados: ${KAFKA_TOPIC_PEDIDOS_FATURADOS:icompras.pedidos-enviados}