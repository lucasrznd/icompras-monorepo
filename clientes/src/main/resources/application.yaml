spring:
  application:
    name: clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/icomprasclientes
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
  jpa:
    show-sql: false
    open-in-view: false
    generate-ddl: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082

springdoc:
  open-api:
    title: MS de Clientes
    description: Microserviço de gerenciamento de clientes
    version: 1.0.0
