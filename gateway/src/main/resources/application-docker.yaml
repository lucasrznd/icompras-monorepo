spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: pedidos
              uri: http://pedidos:8080
              predicates:
                - Path=/api/pedidos/**
              filters:
                - StripPrefix=1

            - id: produtos
              uri: http://produtos:8081
              predicates:
                - Path=/api/produtos/**
              filters:
                - StripPrefix=1

            - id: clientes
              uri: http://clientes:8082
              predicates:
                - Path=/api/clientes/**
              filters:
                - StripPrefix=1

            - id: faturamento
              uri: http://faturamento:8084
              predicates:
                - Path=/api/buckets/**
              filters:
                - StripPrefix=1
